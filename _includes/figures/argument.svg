<line x1="22.0" y1="142.0" x2="96.0" y2="142.0" class="s-muted" style="stroke-width:2"/>
<line x1="22.0" y1="156.0" x2="70.0" y2="156.0" class="s-muted" style="stroke-width:2"/>
