<svg viewBox="0 0 400 240" role="img" aria-label="Agent output is mined into literals and classified into a bipolar argument graph with support and attack edges. A user-supplied fact attacks one literal, which is flagged and sent back to the agents as feedback." data-figure="argument">
<defs>
<marker id="argument-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 9 5 0 9z" class="f-ink"/></marker>
<marker id="argument-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 9 5 0 9z" class="f-red"/></marker>
<marker id="argument-muted" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 9 5 0 9z" style="fill:var(--muted)"/></marker>
<marker id="argument-flat" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M8 0V10" class="s-red" style="stroke-width:2.2"/></marker>
</defs>
<line x1="250.0" y1="18.0" x2="274.0" y2="18.0" class="s" marker-end="url(#argument-ink)" />
