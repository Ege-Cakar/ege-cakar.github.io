<svg viewBox="0 0 400 240" role="img" aria-label="Two methods. (a) Activation-guided GCG: an adversarial suffix is optimized so that hidden states at every layer and position have near-zero projection on a fixed refusal direction. (b) Soft-GCG: each suffix position is a Gumbel-Softmax distribution over the vocabulary that sharpens to nearly one-hot as the temperature is lowered, trained on an output loss and discretized by argmax; about 33 times faster than GCG.">
<defs>
<marker id="gcg-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 9 5 0 9z" class="f-ink"/></marker>
<marker id="gcg-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 9 5 0 9z" class="f-red"/></marker>
<marker id="gcg-muted" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 9 5 0 9z" style="fill:var(--muted)"/></marker>
<marker id="gcg-flat" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M8 0V10" class="s-red" style="stroke-width:2.2"/></marker>
</defs>
<line x1="203" y1="8" x2="203" y2="232" class="s-muted dash" style="stroke-width:.8"/>
