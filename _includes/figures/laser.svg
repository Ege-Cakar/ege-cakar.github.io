<svg viewBox="0 0 400 240" role="img" aria-label="Each recursion step stores small coefficients Z_i = X_i Q against one shared low-rank basis Q instead of the full activation X_i. Across training steps, Q is updated by a power iteration; if fidelity drops below a threshold the rank grows, and repeated misses trigger an SVD reset.">
<defs>
