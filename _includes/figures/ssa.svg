<svg viewBox="0 0 400 240" role="img" aria-label="The input is split into chunks. At step t the reader attends with ordinary softmax attention over a bounded set: M retained chunks, w window chunks, and the current chunk, at most R = (M+w+1)C tokens. A learned scorer gives keep scores to every retained chunk and to the candidate leaving the window, and the lowest score is evicted." data-figure="ssa">
