<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
{% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<script>
  // Runs before first paint so a saved theme doesn't flash the system one.
  try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  function toggleTheme() {
    var r = document.documentElement;
    var dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.classList.add('theme-fade');
    r.dataset.theme = dark ? 'light' : 'dark';
    setTimeout(function () { r.classList.remove('theme-fade'); }, 450);
    try { localStorage.setItem('theme', r.dataset.theme); } catch (e) {}
  }
</script>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
