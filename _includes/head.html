<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
{% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<script>
  // The theme follows the OS. The lamp overrides it for this tab session (sessionStorage,
  // applied before first paint), and the override is dropped when the OS theme changes.
  try { var t = sessionStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  var osDark = matchMedia('(prefers-color-scheme: dark)');
  osDark.addEventListener('change', function () {
    delete document.documentElement.dataset.theme;
    try { sessionStorage.removeItem('theme'); } catch (e) {}
  });
  function toggleTheme() {
    var r = document.documentElement;
    var dark = r.dataset.theme ? r.dataset.theme === 'dark' : osDark.matches;
    r.classList.add('theme-fade');
    r.dataset.theme = dark ? 'light' : 'dark';
    setTimeout(function () { r.classList.remove('theme-fade'); }, 450);
    try { sessionStorage.setItem('theme', r.dataset.theme); } catch (e) {}
  }
</script>
